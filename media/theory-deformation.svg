<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><radialGradient id="g"><stop offset="0" stop-color="#83eed0" stop-opacity=".8"/><stop offset="1" stop-color="#83eed0" stop-opacity=".05"/></radialGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8da9b5"/></marker></defs><rect width="1200" height="470" rx="20" fill="#101a23"/><g font-family="Arial,sans-serif" fill="#eef5f3"><text x="40" y="45" font-size="15" letter-spacing="3" fill="#83eed0">02 / WHY ANIMATION IS MORE THAN MOVING POINTS</text><text x="40" y="95" font-size="24">Rest configuration</text><text x="465" y="95" font-size="24">Local deformation</text><text x="865" y="95" font-size="24">Appearance checks</text><g stroke="#8da9b5" stroke-width="7"><path d="M80 284L200 214L330 244" fill="none"/><path d="M470 284L590 214L694 135" fill="none"/></g><g fill="#f3f6f5"><circle cx="80" cy="284" r="9"/><circle cx="200" cy="214" r="9"/><circle cx="330" cy="244" r="9"/><circle cx="470" cy="284" r="9"/><circle cx="590" cy="214" r="9"/><circle cx="694" cy="135" r="9"/></g><g fill="url(#g)" stroke="#83eed0"><ellipse cx="140" cy="249" rx="45" ry="24" transform="rotate(-30 140 249)"/><ellipse cx="266" cy="229" rx="50" ry="24" transform="rotate(13 266 229)"/><ellipse cx="530" cy="249" rx="45" ry="24" transform="rotate(-30 530 249)"/><ellipse cx="643" cy="174" rx="50" ry="24" transform="rotate(-37 643 174)"/></g><path d="M365 225H437" stroke="#8da9b5" marker-end="url(#a)"/><text x="40" y="355" font-size="17" fill="#c1d2d7">Bind centers to a deformation field</text><text x="40" y="385" font-size="15" fill="#90a6b0">A skeleton or proxy supplies control</text><text x="465" y="355" font-size="17" fill="#c1d2d7">Transform centers AND covariance</text><text x="465" y="385" font-size="15" fill="#90a6b0">Shape and orientation must follow</text><path d="M820 110V395" stroke="#314550"/><g font-size="18"><text x="865" y="163" fill="#83eed0">01</text><text x="905" y="163">Joint volume</text><text x="865" y="212" fill="#83eed0">02</text><text x="905" y="212">Fur continuity</text><text x="865" y="261" fill="#83eed0">03</text><text x="905" y="261">Occlusion and sorting</text><text x="865" y="310" fill="#83eed0">04</text><text x="905" y="310">Eye and eyelid coverage</text></g><text x="865" y="385" font-size="15" fill="#90a6b0">More bones alone do not solve these.</text><text x="40" y="439" font-size="13" fill="#90a6b0">Conceptual illustration by Charles Liao. Gaussian animation extends the static 3DGS representation.</text></g></svg>