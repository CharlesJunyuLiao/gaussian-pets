<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><radialGradient id="g"><stop offset="0" stop-color="#83eed0" stop-opacity=".8"/><stop offset="1" stop-color="#83eed0" stop-opacity=".05"/></radialGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8da9b5"/></marker></defs><rect width="1200" height="470" rx="20" fill="#101a23"/><g font-family="Arial,sans-serif" fill="#eef5f3"><text x="40" y="45" font-size="15" letter-spacing="3" fill="#83eed0">01 / REPRESENTATION TO RENDERING</text><path d="M400 82V390 M800 82V390" stroke="#314550"/><text x="40" y="92" font-size="23">3D Gaussian</text><text x="435" y="92" font-size="23">2D projected footprint</text><text x="835" y="92" font-size="23">Visibility + color</text><g transform="translate(202 229) rotate(-28)"><ellipse rx="135" ry="68" fill="url(#g)" stroke="#83eed0"/><ellipse rx="135" ry="29" fill="none" stroke="#83eed0" opacity=".55"/><ellipse rx="45" ry="68" fill="none" stroke="#83eed0" opacity=".55"/><path d="M-150 0H150 M0-85V85" stroke="#8da9b5" stroke-dasharray="4 5"/><circle r="5" fill="#fff"/></g><text x="40" y="355" font-size="17" fill="#c1d2d7">Center + orientation + scale</text><text x="40" y="385" font-size="15" fill="#90a6b0">Opacity and view-dependent color</text><path d="M347 225H425" stroke="#8da9b5" marker-end="url(#a)"/><rect x="470" y="138" width="255" height="177" rx="7" fill="#192b36" stroke="#405b68"/><path d="M470 182H725M470 226H725M470 270H725M521 138V315M572 138V315M623 138V315M674 138V315" stroke="#304550"/><ellipse cx="596" cy="225" rx="105" ry="42" transform="rotate(-22 596 225)" fill="url(#g)" stroke="#83eed0"/><text x="435" y="355" font-size="17" fill="#c1d2d7">Camera projection + local Jacobian</text><text x="435" y="385" font-size="15" fill="#90a6b0">A soft ellipse, not a hard-edged disk</text><path d="M745 225H825" stroke="#8da9b5" marker-end="url(#a)"/><ellipse cx="1000" cy="185" rx="90" ry="42" fill="#789be8" opacity=".5"/><ellipse cx="973" cy="222" rx="90" ry="42" fill="#e9bb89" opacity=".55"/><ellipse cx="946" cy="259" rx="90" ry="42" fill="#83eed0" opacity=".6"/><path d="M1118 165V296" stroke="#8da9b5" marker-end="url(#a)"/><text x="835" y="355" font-size="17" fill="#c1d2d7">Front-to-back alpha compositing</text><text x="835" y="385" font-size="15" fill="#90a6b0">Near splats reduce light from behind</text><text x="40" y="439" font-size="13" fill="#90a6b0">Conceptual illustration by Charles Liao. Ellipses visualize covariance contours; sizes and opacity are schematic.</text></g></svg>